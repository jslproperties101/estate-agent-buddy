# Estate Agent Buddy — build and check on every push.
#  test     type check, lint, unit tests, browser screen tests (no keys needed)
#  database Supabase migrations: roles and row-level security tested on PostgreSQL
#  android  debug APK (Capacitor), attached to a GitHub Release "android-<commit>" for download on the phone;
#           with the Maps key secret set, also loads the real Google map in a browser and attaches a screenshot
#  website  QA branches: the laptop website (test Supabase) uploaded by FTP to estateagentaibuddy.page.gd
#  web      the same bundle as a website on GitHub Pages, plus updates/latest.json + the bundle zip that installed
#           apps download by themselves (needs Pages source = GitHub Actions)
#
# Settings → Secrets and variables → Actions → Repository secrets (none are written in the code):
#   EAB_GOOGLE_MAPS_API_KEY   Google Maps key (browser key, restricted by website)
#   EAB_SUPABASE_URL          Supabase project URL (login and cloud sync)
#   EAB_SUPABASE_ANON_KEY     Supabase anon (public) key
#   EAB_EXPERT_API_URL        optional Ask Expert AI function URL
#   EAB_QA_SUPABASE_URL       the separate TEST Supabase project's URL, for the QA APK only (optional)
#   EAB_QA_SUPABASE_ANON_KEY  that test project's anon (public) key, for the QA APK only (optional)
#   EAB_WEB_FTP_HOST          laptop website (JoyChange002 Change 47): InfinityFree FTP host, e.g. ftpupload.net
#   EAB_WEB_FTP_USER          InfinityFree FTP username (if0_...)
#   EAB_WEB_FTP_PASSWORD      InfinityFree FTP password (the hosting account password)
name: Build

on:
  push:
    # Owner, 17 Oct 2026: dated change branches (for example 2.0.26.10.17.1) build too, as the isolated QA APK only.
    branches: [main, 'feature/**', '2.*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Install (without the Android packages)
        run: npm install --omit=optional --no-audit --no-fund
      - name: Browser for screen tests
        run: npx playwright install --with-deps chromium
      - name: Tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee ../test.log
      - name: Report failing tests
        if: failure()
        run: |
          # Each failing test and its first error lines as an annotation (readable without the full log).
          sed 's/\x1b\[[0-9;]*m//g' ../test.log | awk '/^not ok/{n=1; msg=$0; next} n && n<25 {msg=msg" | "$0; n++} n==25 || (n && /^  \.\.\./){print "::error::" substr(msg,1,1500); n=0}' || true
          grep -E "error TS|problem\(s\)|Lint" ../test.log | head -20 | sed 's/^/::error::/' || true
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: screens, path: app/tests/screens, if-no-files-found: ignore }

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Roles and row-level security (Supabase migrations)
        env: { PGHOST: localhost, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: postgres }
        run: bash supabase/tests/rls-test.sh
      - name: Migration rollback rehearsal (local PostgreSQL)
        env: { PGHOST: localhost, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: postgres }
        run: bash supabase/tests/rollback-test.sh
      - name: Proposed block on old-app direct writes (local PostgreSQL, not applied anywhere)
        env: { PGHOST: localhost, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: postgres }
        run: bash supabase/tests/write-block-test.sh
      - name: Change 010 proposal - Team Workspace, sharing, audit (local PostgreSQL, not applied anywhere)
        env: { PGHOST: localhost, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: postgres }
        run: bash supabase/tests/change010-test.sh
      - name: Change 006 x Change 010 - who can read a record's files; revoking and leaving end access (local PostgreSQL)
        env: { PGHOST: localhost, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: postgres }
        run: bash supabase/tests/file-access-test.sh
      - name: Change 006 Layer 4 - encrypted platform backup format (Node, temporary folders only)
        run: node --test ops/platform-backup/platform-backup.test.mjs
      - name: Change 006 Layer 4 - dump, encrypt, restore into a NEW database with each key holder (local PostgreSQL, synthetic data)
        env: { PGHOST: localhost, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: postgres }
        run: bash supabase/tests/platform-backup-test.sh
      - name: Changes 19 and 20 - usage log and Developer Dashboard, developer-only access (local PostgreSQL)
        env: { PGHOST: localhost, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: postgres }
        run: bash supabase/tests/change019-test.sh
      - name: Existing roles and row-level security again, with the Change 010 proposal on top
        env: { PGHOST: localhost, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: postgres, EAB_WITH_CHANGE010: '1' }
        run: bash supabase/tests/rls-test.sh

  android:
    # "prod" = the normal debug APK (same package as your real app, publishes the update package).
    # "qa"   = the isolated QA APK (separate package name and storage, updates itself from its own beta-updates list, release tag qa-<commit>).
    # Integrated release 2.0.010 (Oct 2026), narrowest safe change:
    #   - a branch whose name contains "qa", or a dated change branch starting with "2." (owner, 17 Oct 2026), builds
    #     ONLY the QA APK (no normal-package APK is built or offered there);
    #   - every other branch still builds and checks the normal APK, but only main and feature/v2-full-update attach
    #     it to a GitHub Release (feature branches no longer publish an APK that installs over the real app).
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON((contains(github.ref_name, 'qa') || startsWith(github.ref_name, '2.')) && '["qa"]' || '["prod"]') }}
    name: android (${{ matrix.variant }})
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    env:
      EAB_QA: ${{ matrix.variant == 'qa' && '1' || '' }}
      PUBLISH_APK: ${{ (matrix.variant == 'qa' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/v2-full-update') && '1' || '' }}
      EAB_GOOGLE_MAPS_API_KEY: ${{ secrets.EAB_GOOGLE_MAPS_API_KEY }}
      # The QA APK never gets the production Supabase project built in: it uses the separate TEST project's secrets
      # (EAB_QA_SUPABASE_URL / EAB_QA_SUPABASE_ANON_KEY) when they exist; without them the QA app asks for the
      # connection on its sign-in screen (Connection settings). Production builds are unchanged.
      EAB_SUPABASE_URL: ${{ matrix.variant == 'qa' && secrets.EAB_QA_SUPABASE_URL || matrix.variant != 'qa' && secrets.EAB_SUPABASE_URL || '' }}
      EAB_SUPABASE_ANON_KEY: ${{ matrix.variant == 'qa' && secrets.EAB_QA_SUPABASE_ANON_KEY || matrix.variant != 'qa' && secrets.EAB_SUPABASE_ANON_KEY || '' }}
      EAB_EXPERT_API_URL: ${{ secrets.EAB_EXPERT_API_URL }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Install (Android packages as regular dependencies, so Capacitor bundles their native parts)
        run: |
          node -e "const f='package.json',p=require('./'+f);p.dependencies={...p.dependencies,...p.optionalDependencies};delete p.optionalDependencies;require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
          npm install --no-audit --no-fund
      - name: Build for the Google Maps check (without sign-in, so the check reaches Settings)
        if: env.EAB_GOOGLE_MAPS_API_KEY != '' && matrix.variant == 'prod'
        run: |
          EAB_SUPABASE_URL= EAB_SUPABASE_ANON_KEY= npm run build
          rm -rf ../dist-maps-check && cp -r dist ../dist-maps-check
      - name: Build the app
        run: npm run build && rm -f dist/*.map
      - name: Update package for installed apps (no reinstall needed)
        if: matrix.variant == 'prod'
        run: |
          SHORT=${GITHUB_SHA::7}
          NATIVE=$(node -p "require('./package.json').nativeVersion || 1")
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p ../site && cp -r dist/. ../site/ && mkdir -p ../site/updates
          (cd dist && zip -qr "../../site/updates/bundle-${SHORT}.zip" .)
          BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          APK="https://github.com/${GITHUB_REPOSITORY}/releases/download/android-${SHORT}/EstateAgentBuddy-${SHORT}-debug.apk"
          printf '{"sha":"%s","version":"%s","nativeVersion":%s,"bundle":"%s/updates/bundle-%s.zip","apk":"%s","builtAt":"%s","branch":"%s"}\n' \
            "$SHORT" "$VERSION" "$NATIVE" "$BASE" "$SHORT" "$APK" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_REF_NAME" > ../site/updates/latest.json
          cat ../site/updates/latest.json
      - uses: actions/upload-artifact@v4
        if: matrix.variant == 'prod'
        with: { name: site, path: site }
      - name: Android project
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#08080A' --iconBackgroundColorDark '#08080A' --splashBackgroundColor '#08080A' --splashBackgroundColorDark '#08080A'
          npx cap sync android
          node scripts/android-setup.mjs
      - name: Build the APK
        run: |
          # Every phone feature must have its native part in the APK, or its button cannot work on the phone.
          for P in '"@capacitor/app"' '"@capacitor-community/speech-recognition"' '"@capacitor-community/contacts"' '"@capacitor/local-notifications"' '"@capacitor/filesystem"' '"@capacitor/share"' '"@capacitor-community/admob"' '"@capacitor/push-notifications"'; do
            grep -q "$P" android/app/src/main/assets/capacitor.plugins.json || { echo "Native plugin missing: $P"; cat android/app/src/main/assets/capacitor.plugins.json; exit 1; }
          done
          # JoyChange002 Change 25: Firebase push needs google-services.json next to the app's build file.
          test -s android/app/google-services.json || { echo "android/app/google-services.json missing (push notifications)"; exit 1; }
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Check the APK (package name, app name, launcher icons, splash, QA flag)
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          if [ "$EAB_QA" = "1" ]; then node scripts/verify-apk.mjs "$APK" com.jslproperties.estateagentbuddy.qa "EAB QA" qa; else node scripts/verify-apk.mjs "$APK" com.jslproperties.estateagentbuddy "Estate Agent AI Buddy" prod; fi
      - name: Check the APK signature (same debug key every build)
        run: |
          SHA1=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -m1 'SHA1:' | awk '{print $2}')
          echo "APK SHA1 $SHA1"
          test "$SHA1" = "1A:F9:28:D6:59:1C:90:C7:02:CD:67:D3:E9:54:3F:34:3C:DD:94:64"
      - name: Name the APK
        id: apk
        run: |
          SHORT=${GITHUB_SHA::7}
          if [ "$EAB_QA" = "1" ]; then OUT="EstateAgentBuddy-QA-${SHORT}-debug.apk"; TAG="qa-$SHORT"; else OUT="EstateAgentBuddy-${SHORT}-debug.apk"; TAG="android-$SHORT"; fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "../$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "maps=$([ -n "$EAB_GOOGLE_MAPS_API_KEY" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "supabase=$([ -n "$EAB_SUPABASE_URL" ] && [ -n "$EAB_SUPABASE_ANON_KEY" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: env.PUBLISH_APK == '1'
        with: { name: 'apk-${{ matrix.variant }}', path: '${{ steps.apk.outputs.file }}' }
      - name: Real Google Maps check (only with the Maps key secret)
        id: maps
        if: steps.apk.outputs.maps == 'yes' && matrix.variant == 'prod'
        continue-on-error: true
        run: |
          npx playwright install --with-deps chromium
          MAPS_CHECK_DIST=../dist-maps-check node scripts/maps-check.mjs ../maps-check.png ../maps-check.txt
      - name: Release with the APK
        if: env.PUBLISH_APK == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ..
          TAG='${{ steps.apk.outputs.tag }}'
          {
            if [ "$EAB_QA" = "1" ]; then
              echo "**QA APK (isolated test app)** for commit ${GITHUB_SHA} (${GITHUB_REF_NAME}), build ${GITHUB_RUN_NUMBER}."
              echo
              echo "Package com.jslproperties.estateagentbuddy.qa, app name EAB QA: installs BESIDE your real app, with its own empty storage. It updates itself from newer QA builds (never from the real app's updates); Settings -> About shows the commit it is running. Settings -> About shows the commit and says QA."
            else
              echo "Debug APK for commit ${GITHUB_SHA} (${GITHUB_REF_NAME}), build ${GITHUB_RUN_NUMBER}. WARNING: same package as your real app; it installs over it and may switch itself to the production bundle. For testing use the QA APK."
            fi
            echo
            echo "Install: open this page on the Android phone, tap the .apk below, allow installing from this source, then Install."
            echo
            echo "- Google Maps key in this build: ${{ steps.apk.outputs.maps }}"
            echo "- Google login (Supabase) in this build: ${{ steps.apk.outputs.supabase }}"
            if [ -f maps-check.txt ]; then echo; echo "Google Maps check (browser, referrer https://localhost/):"; echo '```'; cat maps-check.txt; echo '```'; fi
          } > notes.md
          FILES="${{ steps.apk.outputs.file }}"
          [ -f maps-check.png ] && FILES="$FILES maps-check.png"
          [ -f maps-check.txt ] && FILES="$FILES maps-check.txt"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" $FILES --prerelease --target "$GITHUB_SHA" --title "Estate Agent Buddy ${TAG}" --notes-file notes.md
      - name: Update list for the QA app (automatic updates for the QA APK only)
        # Runs AFTER the release is published, so the app never sees a download link whose APK does not exist yet (it gave a 404).
        # JoyChange003: the installed QA app reads this list and downloads the newest QA screens and logic by itself.
        # It lives on its own branch (beta-updates: the name has no "qa" so it never starts a build) and is rewritten from
        # scratch each time, so the repository does not grow. The real app's list (GitHub Pages) is never touched.
        if: matrix.variant == 'qa' && env.PUBLISH_APK == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=${GITHUB_SHA::7}
          NATIVE=$(node -p "require('./package.json').nativeVersion || 1")
          VERSION=$(node -p "require('./package.json').version")
          OUTD=$(mktemp -d)
          (cd dist && zip -qr "$OUTD/bundle-${SHORT}.zip" .)
          BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/beta-updates"
          APK="https://github.com/${GITHUB_REPOSITORY}/releases/download/qa-${SHORT}/EstateAgentBuddy-QA-${SHORT}-debug.apk"
          printf '{"sha":"%s","version":"%s","nativeVersion":%s,"bundle":"%s/bundle-%s.zip","apk":"%s","builtAt":"%s","branch":"%s"}\n' \
            "$SHORT" "$VERSION" "$NATIVE" "$BASE" "$SHORT" "$APK" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_REF_NAME" > "$OUTD/latest.json"
          cat "$OUTD/latest.json"
          cd "$OUTD" && git init -q -b beta-updates && git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "QA update list for ${SHORT}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" beta-updates

  website:
    # JoyChange002 Change 47: the laptop website (wide layout, no adverts, no phone-only parts), built against the TEST
    # Supabase project and uploaded by FTP to InfinityFree (estateagentaibuddy.page.gd). QA branches only, after the
    # tests pass; skipped (with a note) until the three FTP secrets exist. The live Supabase project is never built in.
    needs: test
    if: contains(github.ref_name, 'qa') || startsWith(github.ref_name, '2.')
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    env:
      EAB_WEBSITE: '1'
      EAB_SUPABASE_URL: ${{ secrets.EAB_QA_SUPABASE_URL }}
      EAB_SUPABASE_ANON_KEY: ${{ secrets.EAB_QA_SUPABASE_ANON_KEY }}
      EAB_GOOGLE_MAPS_API_KEY: ${{ secrets.EAB_GOOGLE_MAPS_API_KEY }}
      EAB_EXPERT_API_URL: ${{ secrets.EAB_EXPERT_API_URL }}
      FTP_HOST: ${{ secrets.EAB_WEB_FTP_HOST }}
      FTP_USER: ${{ secrets.EAB_WEB_FTP_USER }}
      FTP_PASSWORD: ${{ secrets.EAB_WEB_FTP_PASSWORD }}
      FTP_DIR: ${{ vars.EAB_WEB_FTP_DIR || 'htdocs' }}
      SITE_URL: ${{ vars.EAB_WEB_URL || 'https://estateagentaibuddy.page.gd/' }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Install (without the Android packages)
        run: npm install --omit=optional --no-audit --no-fund
      - name: Build the website
        run: |
          [ -n "$EAB_SUPABASE_URL" ] || echo "::warning::EAB_QA_SUPABASE_URL is not set: the website will ask for the connection on its sign-in screen."
          npm run build
          rm -f dist/*.map
          test -f dist/.htaccess
          ls -la dist
      - name: Upload to the website (FTP over TLS)
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::warning::Website not uploaded: add the secrets EAB_WEB_FTP_HOST, EAB_WEB_FTP_USER and EAB_WEB_FTP_PASSWORD (InfinityFree → Accounts → FTP Details)."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null
          up() {
            lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate $1; set net:max-retries 3; set net:timeout 30; mirror -R --verbose=1 --no-perms --exclude-glob *.map dist $FTP_DIR; bye"
          }
          # Encrypted always. InfinityFree's FTP server has been known not to send its full certificate chain; if checking
          # the certificate fails, the upload is retried still encrypted but without that check, and this says so.
          up true || { echo "::warning::FTP certificate could not be verified; uploaded over TLS without certificate verification."; up false; }
          echo "Website: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Built from ${GITHUB_SHA::7} against the TEST Supabase project." >> "$GITHUB_STEP_SUMMARY"

  web:
    # The web version and the update package for installed apps: exactly the bundle built (and tested) for the APK.
    needs: android
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/v2-full-update'
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: site, path: site }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
